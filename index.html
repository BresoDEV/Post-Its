<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lembretes | Post-Its</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #facc15;
      --accent-2: #38bdf8;
      --radius-xl: 28px;
      --radius-md: 18px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.24), transparent 34%),
        radial-gradient(circle at top right, rgba(250, 204, 21, 0.20), transparent 30%),
        linear-gradient(135deg, #020617 0%, #0f172a 48%, #111827 100%);
      padding: 32px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: min(1100px, 100%);
    }

    /* COMPOSER CENTRALIZADO */
    .composer {
      margin: 0 auto 40px;
      max-width: 520px;
      border-radius: var(--radius-xl);
      padding: 26px;
      border: 1px solid rgba(255,255,255,.12);
      background: var(--panel);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
    }

    .composer h1 {
      font-size: 32px;
      margin-bottom: 18px;
      text-align: center;
      letter-spacing: -0.04em;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input, textarea, select {
      width: 100%;
      color: var(--text);
      background: rgba(15, 23, 42, .72);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 16px;
      padding: 14px;
      outline: none;
      font: inherit;
    }

    textarea { min-height: 120px; resize: vertical; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      flex: 1;
      background: linear-gradient(135deg, #facc15, #fde68a);
      color: #111827;
    }

    .secondary {
      background: rgba(255,255,255,.12);
      color: var(--text);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 10px;
    }

    .toolbar h2 { font-size: 26px; }

    .search {
      max-width: 260px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .note {
      border-radius: 20px;
      padding: 20px;
      min-height: 200px;
      position: relative;
    }

    .note[data-color="yellow"] { background: #fde68a; color: #1f2937; }
    .note[data-color="blue"] { background: #bae6fd; color: #082f49; }
    .note[data-color="pink"] { background: #fecdd3; color: #4c0519; }
    .note[data-color="green"] { background: #bbf7d0; color: #052e16; }

    .note-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 12px;
      font-weight: bold;
    }

    .delete {
      background: transparent;
      font-size: 18px;
      cursor: pointer;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 30px;
    }

    @media (max-width: 800px) {
      .board { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 500px) {
      .board { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app">

    <form class="composer" id="noteForm">
      <h1>Novo lembrete</h1>

      <div class="field">
        <label>Título</label>
        <input id="title" required />
      </div>

      <div class="field">
        <label>Descrição</label>
        <textarea id="message" required></textarea>
      </div>

      <div class="row">
        <select id="priority">
          <option>Normal</option>
          <option>Importante</option>
          <option>Urgente</option>
        </select>

        <select id="color">
          <option value="yellow">Amarelo</option>
          <option value="blue">Azul</option>
          <option value="pink">Rosa</option>
          <option value="green">Verde</option>
        </select>
      </div>

      <div class="actions">
        <button class="primary">Salvar</button>
        <button type="button" class="secondary" id="clearAll">Limpar</button>
      </div>
    </form>

    <div class="toolbar">
      <h2>Mural</h2>
      <input class="search" id="search" placeholder="Buscar..." />
    </div>

    <div class="board" id="board"></div>

  </main>

  <script>
    const form = document.querySelector('#noteForm');
    const board = document.querySelector('#board');
    const search = document.querySelector('#search');
    const clearAll = document.querySelector('#clearAll');

    let notes = JSON.parse(localStorage.getItem('postits')) || [];

    function save() {
      localStorage.setItem('postits', JSON.stringify(notes));
    }

    function render() {
      const term = search.value.toLowerCase();
      const filtered = notes.filter(n =>
        n.title.toLowerCase().includes(term) ||
        n.message.toLowerCase().includes(term)
      );

      if (!filtered.length) {
        board.innerHTML = '<div class="empty">Nenhum lembrete</div>';
        return;
      }

      board.innerHTML = filtered.map(n => `
        <div class="note" data-color="${n.color}">
          <div class="note-header">
            <span class="badge">${n.priority}</span>
            <button class="delete" onclick="del('${n.id}')">×</button>
          </div>
          <h3>${n.title}</h3>
          <p>${n.message}</p>
        </div>
      `).join('');
    }

    function del(id) {
      notes = notes.filter(n => n.id !== id);
      save(); render();
    }

    form.onsubmit = e => {
      e.preventDefault();
      notes.unshift({
        id: crypto.randomUUID(),
        title: title.value,
        message: message.value,
        priority: priority.value,
        color: color.value
      });
      form.reset(); save(); render();
    };

    search.oninput = render;

    clearAll.onclick = () => {
      notes = []; save(); render();
    };

    render();
  </script>
</body>
</html>
